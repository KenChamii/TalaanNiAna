<div
  class="banner"
  *ngIf="!connection.isOnline() || outbox.count() > 0"
  [class.banner--offline]="!connection.isOnline()"
  [class.banner--waiting]="connection.isOnline() && outbox.count() > 0">

  <button type="button" class="banner-bar" (click)="toggle()">
    <span class="dot" aria-hidden="true"></span>

    <span class="banner-text" *ngIf="!connection.isOnline()">
      {{ 'offline.noConnection' | t }}
    </span>
    <span class="banner-text" *ngIf="connection.isOnline() && outbox.count() > 0">
      {{ 'offline.sending' | t }}
    </span>

    <span class="banner-count" *ngIf="outbox.count() > 0">
      {{ 'offline.waiting' | t: { count: outbox.count() } }}
    </span>

    <span class="banner-chevron" aria-hidden="true">{{ isExpanded() ? '▴' : '▾' }}</span>
  </button>

  <div class="banner-body" *ngIf="isExpanded()">

    <p class="banner-note" *ngIf="outbox.count() === 0">
      {{ 'offline.nothingWaiting' | t }}
    </p>

    <div class="queued" *ngFor="let sale of outbox.pending()">
      <div class="queued-text">
        <span class="queued-total">{{ sale.total | peso }}</span>
        <span class="queued-meta">
          {{ sale.itemCount }} {{ 'common.pieces' | t }} · {{ sale.ringUpAt | date:'h:mm a' }}
        </span>
        <span class="queued-error" *ngIf="sale.lastError">{{ sale.lastError }}</span>
      </div>

      <button
        type="button"
        class="queued-drop"
        *ngIf="sale.attempts >= 5"
        (click)="discard(sale.id)">
        {{ 'offline.discard' | t }}
      </button>
    </div>

    <button
      type="button"
      class="banner-retry"
      *ngIf="outbox.count() > 0"
      (click)="retry()">
      {{ 'offline.retry' | t }}
    </button>

    <p class="banner-note" *ngIf="outbox.stuck().length > 0">
      {{ 'offline.rejected' | t: { count: outbox.stuck().length } }}
    </p>

  </div>
</div>

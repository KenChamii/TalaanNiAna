<app-toast></app-toast>
<div class="shell">
  <header class="topbar">
    <span class="brand">Talaan ni Ana</span>

    <div class="topbar-right">
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Lumipat sa araw mode' : 'Lumipat sa gabi mode'">
        {{ theme.theme() === 'dark' ? 'Araw' : 'Gabi' }}
      </button>
      <span class="badge badge--ok store-name">{{ storeName() || 'Walang pangalan' }}</span>
    </div>
  </header>

  <div class="jeep-stripe" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="body">
    <nav class="sidebar">
      <p class="meta nav-heading">Menu</p>

      <a *ngFor="let item of navItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="nav-link">
        {{ item.label }}
      </a>

      <button type="button" class="nav-link logout" (click)="logout()">
        Mag-logout
      </button>
    </nav>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

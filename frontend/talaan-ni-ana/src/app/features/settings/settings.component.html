<p class="eyebrow">Impormasyon at configuration</p>
<h2 class="page-title">Settings</h2>

<div class="card settings-card">
  <h3 class="section-title">Pangunahing setup ng tindahan</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field-row">
      <label class="field-label" for="storeName">Pangalan ng tindahan</label>
      <input id="storeName" type="text" formControlName="storeName" />
    </div>

    <div class="field-row">
      <label class="field-label" for="timeZoneId">Timezone</label>
      <select id="timeZoneId" formControlName="timeZoneId">
        <option *ngFor="let zone of timeZones" [value]="zone.id">{{ zone.label }}</option>
      </select>
      <p class="hint">Dito nagsisimula at nagtatapos ang araw ng benta.</p>
    </div>

    <div class="field-row">
      <label class="field-label" for="lowStockAlertLimit">Default na low-stock limit</label>
      <input id="lowStockAlertLimit" type="number" formControlName="lowStockAlertLimit" min="0" />
      <p class="hint">Para sa bagong paninda. Bawat item ay may sariling limit.</p>
    </div>

    <div class="field-row">
      <label class="field-label" for="smsAlertTemplate">Template ng paalala sa utang</label>
      <input id="smsAlertTemplate" type="text" formControlName="smsAlertTemplate" />
      <p class="hint">Gamitin ang {{ '{name}' }} at {{ '{amount}' }} para sa pangalan at halaga.</p>
    </div>

    <button type="submit" class="btn-primary" [disabled]="isSaving()">
      {{ isSaving() ? 'Sine-save…' : 'I-save ang settings' }}
    </button>
  </form>
</div>

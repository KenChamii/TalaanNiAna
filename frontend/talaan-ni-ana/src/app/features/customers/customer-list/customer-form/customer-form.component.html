<div class="modal-overlay" (click)="closed.emit()">
  <form class="modal-card card" [formGroup]="form" (ngSubmit)="submit()" (click)="$event.stopPropagation()">
    <h3>{{ 'customers.form.title' | t }}</h3>

    <label for="fullName">{{ 'customers.form.name' | t }}</label>
    <input id="fullName" type="text" formControlName="fullName" [placeholder]="'customers.form.namePlaceholder' | t" />

    <label for="contactNumber">{{ 'customers.form.contact' | t }}</label>
    <input id="contactNumber" type="text" formControlName="contactNumber" placeholder="09171234567" />

    <div class="modal-actions">
      <button type="button" class="btn-secondary" (click)="closed.emit()">{{ 'action.cancel' | t }}</button>
      <button type="submit" class="btn-primary" [disabled]="isSaving">
        {{ (isSaving ? 'action.saving' : 'action.save') | t }}
      </button>
    </div>
  </form>
</div>

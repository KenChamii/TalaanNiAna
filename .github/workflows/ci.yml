name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TalaanNiAna.slnx

      - name: Build
        run: dotnet build TalaanNiAna.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TalaanNiAna.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/talaan-ni-ana
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/talaan-ni-ana/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

  # Builds both images on every push and pull request, so a broken Dockerfile fails here
  # rather than at deploy time. Images are published only from the default branch.
  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only for a push to the default branch. A pull request from a fork has no write access
      # to the registry, and publishing unreviewed code would be wrong in any case.
      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cased because a registry path must be, while a GitHub owner need not be.
      - name: Work out the image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/TalaanNiAna.API/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.prefix.outputs.value }}/api:latest
            ${{ steps.prefix.outputs.value }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/talaan-ni-ana
          file: ./frontend/talaan-ni-ana/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.prefix.outputs.value }}/web:latest
            ${{ steps.prefix.outputs.value }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Render redeploys the API by itself on a push to main. The frontend has no such hook,
  # so it is published here, and only after everything above has passed.
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [backend, frontend, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: frontend/talaan-ni-ana
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/talaan-ni-ana/package-lock.json

      - name: Install
        run: npm ci

      # Rebuilt rather than carried from the frontend job: an artifact upload and
      # download costs more here than the two minutes this takes.
      - name: Build
        run: npm run build -- --configuration production

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend/talaan-ni-ana
